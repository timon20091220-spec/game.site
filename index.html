<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Space War / Neon Rift</title>
  <script>
    (function () {
      function isPhoneOnly() {
        var ua = navigator.userAgent || "";
        var shortSide = Math.min(window.innerWidth || 0, window.innerHeight || 0);
        var longSide = Math.max(window.innerWidth || 0, window.innerHeight || 0);

        var isIPhone = /iPhone|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        var isGalaxyTab = /SM-X/i.test(ua);
        var isTabletWord = /Tablet|iPad/i.test(ua);

        var looksPhoneSize = shortSide <= 600 && longSide <= 980;

        if (isIPhone) return true;
        if (isAndroid && !isGalaxyTab && !isTabletWord && looksPhoneSize) return true;
        return false;
      }

      location.replace(isPhoneOnly() ? "mobile.html" : "pc_tablet.html");
    })();
  </script>
</head>
<body>
  <p>Loading Space War...</p>
</body>
</html>
