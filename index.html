<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Space War / Neon Rift</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050816;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .box {
      text-align: center;
      padding: 28px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      background: rgba(8,14,28,.82);
      box-shadow: 0 0 32px rgba(103,232,249,.16);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { opacity: .8; margin: 0 0 18px; }
    a {
      display: inline-block;
      margin: 6px;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(103,232,249,.55);
      background: rgba(103,232,249,.18);
      color: white;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
  <script>
    function getSizeInfo() {
      var vw = window.innerWidth || 0;
      var vh = window.innerHeight || 0;
      var sw = screen.width || vw;
      var sh = screen.height || vh;
      return {
        vShort: Math.min(vw, vh),
        vLong: Math.max(vw, vh),
        sShort: Math.min(sw, sh),
        sLong: Math.max(sw, sh)
      };
    }

    function isTabletLike() {
      var ua = navigator.userAgent || "";
      var touch = navigator.maxTouchPoints || 0;
      var size = getSizeInfo();

      var isIPad = /iPad/i.test(ua) || (navigator.platform === "MacIntel" && touch > 1);
      var isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
      var isGalaxyTab = /SM-X|Galaxy Tab|Tab S/i.test(ua);

      var bigTouchByViewport = touch > 0 && size.vShort >= 600;
      var bigTouchByScreen = touch > 0 && size.sShort >= 600;
      var suspiciousBigMobile = /Android/i.test(ua) && /Mobile/i.test(ua) && touch > 0 && (
        size.vShort >= 600 || size.sShort >= 600 || size.sLong >= 1000
      );

      return isIPad || isAndroidTablet || isGalaxyTab || bigTouchByViewport || bigTouchByScreen || suspiciousBigMobile;
    }

    function isPhoneOnly() {
      var ua = navigator.userAgent || "";
      var size = getSizeInfo();

      if (isTabletLike()) return false;

      var isIPhone = /iPhone|iPod/i.test(ua);
      var isAndroidPhone = /Android/i.test(ua) && /Mobile/i.test(ua);

      var phoneViewport = size.vShort < 600 && size.vLong <= 980;
      var phoneScreen = size.sShort < 600;

      if (isIPhone && phoneViewport) return true;
      if (isAndroidPhone && phoneViewport && phoneScreen) return true;
      return false;
    }

    function autoStart() {
      location.replace(isPhoneOnly() ? "mobile_v392.html" : "pc_original.html");
    }

    window.addEventListener("DOMContentLoaded", function () {
      setTimeout(autoStart, 250);
    });
  </script>
</head>
<body>
  <div class="box">
    <h1>Space War</h1>
    <p>휴대폰은 v392, 태블릿과 PC는 조이스틱/DASH가 있는 PC 버전으로 엽니다.</p>
    <a href="pc_original.html">PC / 태블릿 버전 열기</a>
    <a href="mobile_v392.html">휴대폰 v392 직접 열기</a>
  </div>
</body>
</html>
