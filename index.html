  function setupMobileControls() {
    const controls = document.getElementById('mobileControls');
    const joy = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    const dash = document.getElementById('dashTouch');
    const novaBtn = document.getElementById('novaTouch');
    if (!controls || !joy || !stick || !dash || !novaBtn) return;

    function isMobile(){
      return (window.matchMedia && matchMedia('(pointer: coarse)').matches) || window.innerWidth <= 820;
    }
    function updateShow(){
      // v166: 게임 플레이 중에만 모바일 조작 버튼 표시. 로비/업그레이드/선택창에서는 숨김.
      controls.classList.toggle('show', isMobile() && state === 'play');
    }
    function clearMove(){
      keys.w = keys.a = keys.s = keys.d = 0;
      keys.arrowup = keys.arrowleft = keys.arrowdown = keys.arrowright = 0;
      mobileMove.x = 0; mobileMove.y = 0; mobileMove.power = 0; mobileMove.active = false;
    }
    function setMove(dx, dy){
      // v240-split: 캐릭터 이동은 v166 원래 키 입력식 그대로. 플로팅 조이스틱 위치만 유지한다.
      clearMove();
      const dead = 8;
      if (Math.abs(dx) < dead && Math.abs(dy) < dead) return;
      if (dy < -dead) { keys.w = 1; keys.arrowup = 1; }
      if (dy >  dead) { keys.s = 1; keys.arrowdown = 1; }
      if (dx < -dead) { keys.a = 1; keys.arrowleft = 1; }
      if (dx >  dead) { keys.d = 1; keys.arrowright = 1; }
      if (Math.hypot(dx, dy) > dead) p.lastAim = Math.atan2(dy, dx);
    }
    let active=false, pid=null;

    function placeJoystickAt(clientX, clientY){
      // v170: 조이스틱 원판 자체가 첫 터치 위치로 이동한다.
      // 이동 판정은 기존 키 입력식 그대로 유지한다.
      const size = joy.offsetWidth || 148;
      const margin = 10;
      const half = size / 2;
      const x = Math.max(margin + half, Math.min(window.innerWidth - margin - half, clientX));
      const y = Math.max(margin + half, Math.min(window.innerHeight - margin - half, clientY));
      joy.style.left = (x - half) + 'px';
      joy.style.top = (y - half) + 'px';
      joy.style.right = 'auto';
      joy.style.bottom = 'auto';
    }

    function isActionTouchTarget(e){
      const path = e.composedPath ? e.composedPath() : [];
      return path.includes(dash) || path.includes(novaBtn);
    }

    function inJoystickZone(e){
      // 왼쪽 조작 영역에서만 새 조이스틱을 시작해서 오른쪽 DASH/NOVA와 충돌하지 않게 한다.
      return e.clientX <= window.innerWidth * 0.62 && e.clientY >= window.innerHeight * 0.22;
    }

    function move(clientX, clientY){
      const r = joy.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;
      let dx = clientX - cx, dy = clientY - cy;
      const max = r.width * .38;
      const len = Math.hypot(dx,dy);
      if (len > max) { dx = dx / len * max; dy = dy / len * max; }
      stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      setMove(dx, dy);
    }

    function startJoystick(e){
      if (!isMobile() || state !== 'play') return;
      if (active || isActionTouchTarget(e) || !inJoystickZone(e)) return;
      active = true;
      pid = e.pointerId;
      e.preventDefault();
      placeJoystickAt(e.clientX, e.clientY);
      stick.style.transform = 'translate(-50%,-50%)';
      clearMove();
    }

    window.addEventListener('pointerdown', startJoystick, {passive:false, capture:true});
    window.addEventListener('pointermove', e => {
      if (!active || e.pointerId !== pid) return;
      e.preventDefault();
      move(e.clientX, e.clientY);
    }, {passive:false, capture:true});
    function end(e){
      if (pid != null && e && e.pointerId !== pid) return;
      active=false; pid=null;
      stick.style.transform = 'translate(-50%,-50%)';
      clearMove();
    }
    window.addEventListener('pointerup', end, {passive:false, capture:true});
    window.addEventListener('pointercancel', end, {passive:false, capture:true});

    dashTouchBtn = dash;
    dash.addEventListener('pointerdown', e => {
      if (!isMobile()) return;
      e.preventDefault();
      if (state === 'play' && p.dashCd <= 0) { p.dash = .18; p.dashCd = 4; updateDashTouchCooldown(); }
    }, {passive:false});

    novaBtn.addEventListener('pointerdown', e => {
      if (!isMobile()) return;
      e.preventDefault();
      nova();
    }, {passive:false});

    window.addEventListener('resize', updateShow, {passive:true});
    window.addEventListener('orientationchange', () => setTimeout(updateShow, 250), {passive:true});
    updateShow();
    setInterval(updateShow, 250);
  }
  function updateDashTouchCooldown() {

  function upgradeWeaponState(w) {
    if (!w || w.stage >= 5) return;
    w.stage++;

    if (w.key === 'shotgun') {
      // 샷건 성장 곡선 재조정: 1레벨은 느리고 묵직하지만, 레벨업할수록 확실히 빨라지고 안정화된다.
      w.dmg += 11;
      w.fr = Math.max(.30, w.fr * .76);
      w.spread = Math.max(.034, w.spread * .78);
      w.range += .14;
      w.bs += 100;
      w.bsize += .75;
      if (w.stage === 3 || w.stage === 5) w.bcount = Math.min(9, w.bcount + 1);
      if (w.stage >= 4) w.pierce = Math.max(w.pierce, 1);
    }
    else if (w.key === 'laser') {
      w.dmg += 24; w.fr = Math.max(.15, w.fr * .84); w.laserWidth += 4; w.laserLength += 90; w.chainCount = Math.min(7, Math.max(w.chainCount, Math.max(0, w.stage - 1)));
    }
    else if (w.key === 'cannon') {
      w.dmg += 7; w.fr = Math.max(.90, w.fr * .96); w.bsize += .7; w.range += .03; w.bs += 25;
      if (w.stage >= 4) w.pierce = Math.max(w.pierce, 1);
    }
    else {
      // 서브무기: 1레벨은 약하지만 레벨업할수록 강해지도록 상승폭을 크게 둠.
      w.dmg += w.key === 'rail' ? 18 : w.key === 'rocket' ? 18 : w.key === 'thunder' ? 16 : 12;
      w.fr = Math.max(.18, w.fr * .88);
      if (['rifle','flame','drone','boomer','ice'].includes(w.key)) w.bcount = Math.min(8, w.bcount + 1);
      if (['laser','thunder','rail'].includes(w.key)) { w.laserWidth += 3; w.laserLength += 90; w.chainCount += 1; }
      if (['rocket','mine'].includes(w.key)) w.bsize += 1.8;
      w.bs += w.bs > 0 ? 60 : 0;
    }
    w.pierce = Math.min(5, w.pierce + (w.stage >= 3 ? 1 : 0));
    syncMainWeaponStats();
  }

  function evolveWeaponState(w) {

    const dmgBonus = { laser:18, shotgun:10, cannon:8, thunder:32, ice:14, drone:12, rocket:18, rail:18, flame:16, mine:16, boomer:14, rifle:16 };
    w.dmg += dmgBonus[key] ?? 14;
    w.fr = Math.max(.12, w.fr * (key === 'laser' ? .92 : key === 'shotgun' ? .62 : .80));
    if (!['laser','thunder','rail'].includes(key)) w.bcount = Math.min(12, w.bcount + 1);
    w.pierce = Math.max(w.pierce, key === 'shotgun' ? 3 : 4);

    else if (key === 'thunder') { w.laserWidth += 4; w.laserLength += 160; w.chainCount += 4; }
    if (['rocket','mine'].includes(key)) w.bsize += 3; if (key === 'cannon') w.bsize += 1.1;
    for (let i=0;i<22;i++) { const a = Math.PI*2*i/22; if (novaEffects.length < 120) novaEffects.push({x:p.x+Math.cos(a)*60,y:p.y+Math.sin(a)*60,r:120,maxR:120,color:weaponPool[key]?.color||'#fff',life:.42,maxLife:.42,kind:key==='laser'?'pulse':'crack'}); }

  function weightedPickUnique(items, count) {
    const out = [], pool = items.slice();
    let guard = 0;
    while (out.length < count && pool.length && guard++ < 300) {
      const total = pool.reduce((s, it) => s + Math.max(0.01, it.weight || 1), 0);
      let r = Math.random() * total, idx = 0;
      for (; idx < pool.length; idx++) { r -= Math.max(0.01, pool[idx].weight || 1); if (r <= 0) break; }
      const pick = pool.splice(Math.min(idx, pool.length - 1), 1)[0];
      if (pick && !out.some(v => v.name === pick.name)) out.push(pick);
    }
    return out;
  }

  function buildRewardCandidates(count=10) {
    const all = [];
    const weaponOpts = getWeaponUpgradeOptions();
    const finalOpts = weaponOpts.filter(o => o.priorityFinal);
    finalOpts.forEach(o => all.push(o));
    const weighted = [
      ...weaponOpts, ...weaponOpts, ...weaponOpts, ...weaponOpts, ...weaponOpts,
      ...getStatPool(), ...getStatPool()
    ];
    let guard = 0;
    while (all.length < count && weighted.length && guard++ < 260) {
      const a = rnd(weighted);
      if (a && !all.some(v => v.name === a.name)) all.push(a);
    }
    return all.slice(0, count);
  }

  function gain(n, reward=true) {
    p.xp += n;
    let ups = 0;
    while (p.xp >= p.next && ups < 10) {
      p.xp -= p.next; p.lv++; p.next = Math.floor(p.next * (p.lv < 12 ? 1.32 : 1.26) + 10); ups++;
      if (reward) showReward('lv');

  }

  function outsideScreenSpawnPoint(kind='normal') {
    // 압박감은 유지하되, 적이 화면 안에서 갑자기 생기지 않도록 현재 카메라 밖에서 스폰
    const margin = kind === 'mini' ? 120 : 90;
    const extra = kind === 'mini' ? 120 + Math.random() * 90 : 80 + Math.random() * 150;
    for (let tries = 0; tries < 36; tries++) {
      const side = Math.floor(Math.random() * 4);
      let x0, y0;
      if (side === 0) { x0 = cam.x + Math.random() * innerW; y0 = cam.y - margin - extra; }
      else if (side === 1) { x0 = cam.x + innerW + margin + extra; y0 = cam.y + Math.random() * innerH; }
      else if (side === 2) { x0 = cam.x + Math.random() * innerW; y0 = cam.y + innerH + margin + extra; }
      else { x0 = cam.x - margin - extra; y0 = cam.y + Math.random() * innerH; }

      x0 = Math.max(40, Math.min(world.w - 40, x0));
      y0 = Math.max(40, Math.min(world.h - 40, y0));
      if (!isOnScreen({ x:x0, y:y0 }, 70) && Math.hypot(x0 - p.x, y0 - p.y) > (kind === 'mini' ? 360 : 300)) {
        return { x:x0, y:y0 };
      }
    }
    // 화면 가장자리 근처에서 실패하면 플레이어 기준 원형 스폰을 쓰되, 시야 밖일 때까지 거리를 늘림
    const base = Math.random() * Math.PI * 2;
    for (let tries = 0; tries < 18; tries++) {
      const d = (kind === 'mini' ? 620 : 720) + tries * 70;
      const a = base + tries * 0.75;
      const x0 = Math.max(40, Math.min(world.w - 40, p.x + Math.cos(a) * d));
      const y0 = Math.max(40, Math.min(world.h - 40, p.y + Math.sin(a) * d));
      if (!isOnScreen({ x:x0, y:y0 }, 70)) return { x:x0, y:y0 };
    }
    return { x: Math.max(40, Math.min(world.w - 40, p.x + 760)), y: Math.max(40, Math.min(world.h - 40, p.y)) };
  }

  function spawnPointByRole(kind='normal') {
    // v134 몬스터 스폰 규칙
    // 원거리: 플레이어 주변 원형 배치
    // 돌진: 한 줄로 들어오도록 직선 레인 배치
    // 탱커: 가장 뒤쪽, 더 먼 거리에서 배치
    const rangedKinds = new Set(['shoot','sniper','bomber','healer']);
    const clampX = v => Math.max(55, Math.min(world.w - 55, v));
    const clampY = v => Math.max(55, Math.min(world.h - 55, v));

    if (rangedKinds.has(kind)) {
      const baseR = Math.max(innerW, innerH) * 0.68 + 260;
      const a = Math.random() * Math.PI * 2;
      for (let tries = 0; tries < 18; tries++) {
        const aa = a + tries * 0.55;
        const rr = baseR + (tries % 3) * 90;
        const x0 = clampX(p.x + Math.cos(aa) * rr);
        const y0 = clampY(p.y + Math.sin(aa) * rr);
        if (!isOnScreen({x:x0,y:y0}, 80) && Math.hypot(x0-p.x,y0-p.y) > 420) return {x:x0,y:y0};
      }
    }

    if (kind === 'charger') {
      // v137 LOCK: 돌진 몬스터 방향 보호. 이 블록은 앞으로 수정하지 않음.
      return outsideScreenSpawnPoint(kind);
    }

    if (kind === 'tank') {
      const behindA = (p.lastAim || 0) + Math.PI + (Math.random() - .5) * .55;
      const back = Math.max(innerW, innerH) * 0.88 + 520;
      for (let tries=0; tries<12; tries++) {
        const aa = behindA + tries * .28;
        const x0 = clampX(p.x + Math.cos(aa) * (back + tries * 55));
        const y0 = clampY(p.y + Math.sin(aa) * (back + tries * 55));
        if (!isOnScreen({x:x0,y:y0}, 90) && Math.hypot(x0-p.x,y0-p.y) > 650) return {x:x0,y:y0};
      }
    }

    return outsideScreenSpawnPoint(kind);
  }

  function chooseSpawnKindByWave(r) {
    // 1웨이브: 일반 몬스터만
    if (currentWave <= 1) return 'normal';

    // 첫 중간보스 전/진행 중/보상 전에는 일반 + 분열만
    if ((!p.midBossCleared || !p.midBossRewardTaken) && currentWave < 6) {
      return r < .78 ? 'normal' : 'split';
    }
    if (!p.midBossCleared || !p.midBossRewardTaken) {
      return r < .78 ? 'normal' : 'split';
    }

    // v240-split: 6웨이브부터 돌진/탱커/원거리 계열이 조금씩 등장하도록 단계별 해금
    if (currentWave <= 6) {
      if (r < .70) return 'normal';
      if (r < .94) return 'split';
      return 'charger';
    }
    if (currentWave <= 8) {
      if (r < .66) return 'normal';
      if (r < .89) return 'split';
      if (r < .96) return 'charger';
      return 'tank';
    }
    if (currentWave <= 10) {
      if (r < .61) return 'normal';
      if (r < .83) return 'split';
      if (r < .91) return 'charger';
      if (r < .97) return 'tank';
      return 'shoot';
    }
    if (currentWave <= 12) {
      if (r < .57) return 'normal';
      if (r < .77) return 'split';
      if (r < .85) return 'charger';
      if (r < .92) return 'tank';
      if (r < .98) return 'shoot';
      return 'sniper';
    }
    if (r < .54) return 'normal';
    if (r < .72) return 'split';
    if (r < .80) return 'charger';
    if (r < .87) return 'tank';
    if (r < .94) return 'shoot';
    if (r < .975) return 'sniper';
    if (r < .992) return 'bomber';
    return 'healer';
  }

  function xpTierForEnemy(e) {
    if (!e) return 1;
    if (['normal','split','shoot','charger'].includes(e.t)) return 1;
    if (['tank','sniper','bomber','healer'].includes(e.t)) return 2;
    return 3;
  }
  function xpAmountForEnemy(e) {
    const tier = xpTierForEnemy(e);
    // 초반에는 XP를 낮게 유지하고, 후반으로 갈수록 드랍량이 더 크게 늘어나게 조정.
    const earlyScale = currentWave <= 5 ? 0.72 : currentWave <= 10 ? 0.86 : 1.0;
    const waveBonus = Math.floor(currentWave * 1.4);
    const midBonus = Math.max(0, currentWave - 10);
    const lateBonus = Math.max(0, currentWave - 20);
    const hardBonus = hardMode ? Math.floor(currentWave * 1.35) : 0;
    const base = tier === 1 ? 8 : tier === 2 ? 19 : 42;
    const growth = tier === 1
      ? waveBonus * 2 + Math.floor(midBonus * 1.7) + Math.floor(lateBonus * 2.8) + hardBonus
      : tier === 2
        ? waveBonus * 4 + Math.floor(midBonus * 2.9) + Math.floor(lateBonus * 4.2) + hardBonus * 2
        : waveBonus * 7 + Math.floor(midBonus * 4.4) + Math.floor(lateBonus * 6.5) + hardBonus * 3;
    return Math.max(3, Math.floor((base + growth) * earlyScale));
  }
  function dropXpOrb(x0, y0, amount, tier=1, ox=0, oy=0) {
    // v240-split: 몬스터를 실제로 죽였을 때 XP가 안 남는 문제 방지. 가득 차면 먼/오래된 XP부터 비우고 드랍한다.
    const limit = Math.max(80, Math.min(perfCaps.pickup || 180, 190));

        .map((pp, idx) => ({ pp, idx, d: pp && pp.t === 'xp' ? Math.hypot((pp.x||0)-p.x, (pp.y||0)-p.y) : -1 }))
        .filter(o => o.pp && o.pp.t === 'xp')
        .sort((a,b) => b.d - a.d);
      const removeCount = Math.max(1, pickups.length - limit + 1);
      const removeIdx = new Set(removable.slice(0, removeCount).map(o => o.idx));
      pickups = pickups.filter((_, idx) => !removeIdx.has(idx));
    }
    pickups.push({ x:x0 + ox, y:y0 + oy, t:'xp', amount, tier, life:999999, permanent:true });
  }

        else if (mode === 1) for (let i = -3; i <= 3; i++) enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(a+i*.12)*(rage?330:285), vy:Math.sin(a+i*.12)*(rage?330:285), r:8, d:16*dmgMul, life:2.2 });

        else if (mode === 3) for (let i=0;i<12;i++){ const ang=a + (i-6)*.22; enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*(rage?270:225),vy:Math.sin(ang)*(rage?270:225),r:6,d:12*dmgMul,life:2.4}); }
        else for (let i=0;i<16;i++){ const zig=a + (i-8)*.18 + (i%2? .25:-.25); enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(zig)*300,vy:Math.sin(zig)*300,r:6,d:14*dmgMul,life:2.6}); }
      } else if (type === 1) {
        for (let i = -3; i <= 3; i++) enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(a+i*.06)*(rage?450:390), vy:Math.sin(a+i*.06)*(rage?450:390), r:6, d:17*dmgMul, life:1.9 });
        if (e.phase % (rage?3:4) === 0) { laserBeams.push({ x1:e.x, y1:e.y, x2:p.x, y2:p.y, width:16, life:.16, color:'#38bdf8' }); takePlayerDamage(8*dmgMul, e.x, e.y); }
      } else {

  function takePlayerDamage(amount, sx=p.x, sy=p.y) {

  function pruneForPerformance() {
    // v240-split: 렉 완화. 후반에 배열이 커지는 것을 더 일찍 정리하되,
    // 플레이어 주변/화면 안/보스/상자는 절대 먼저 지우지 않는다.
    perfFrame++;
    const mobilePerf = isCoarsePointerPerf();
    const bulletLimit = perfCaps.bullet;
    const enemyBulletLimit = perfCaps.enemyBullet;
    const beamLimit = perfCaps.beam;
    const fxLimit = perfCaps.fx;
    const textLimit = perfCaps.text;
    const pickupLimit = perfCaps.pickup;

    if (bullets.length > bulletLimit) bullets.splice(0, bullets.length - bulletLimit);
    if (enemyBullets.length > enemyBulletLimit) enemyBullets.splice(0, enemyBullets.length - enemyBulletLimit);
    if (laserBeams.length > beamLimit) laserBeams.splice(0, laserBeams.length - beamLimit);
    if (novaEffects.length > fxLimit) novaEffects.splice(0, novaEffects.length - fxLimit);
    if (hitTexts.length > textLimit) hitTexts.splice(0, hitTexts.length - textLimit);
    if (boomerangs.length > 18) boomerangs.splice(0, boomerangs.length - 18);
    if (pickups.length > pickupLimit) {
      const xp = [];
      const other = [];
      for (let i = pickups.length - 1; i >= 0; i--) {
        const pp = pickups[i];
        if (!pp) continue;
        if (pp.t === 'xp' && xp.length < Math.floor(pickupLimit * .78)) xp.push(pp);
        else if (pp.t !== 'xp' && other.length < Math.ceil(pickupLimit * .22)) other.push(pp);
      }
      pickups = xp.reverse().concat(other.reverse());
    }

    const limit = dir.bossRound ? Math.min(90, perfCaps.enemy) : perfCaps.enemy;
    if (!dir.bossRound && enemies.length > limit) {
      const keep = [];
      const normal = [];
      for (const e of enemies) {
        if (!e || e.dead) continue;
        const dist = Math.hypot(e.x - p.x, e.y - p.y);
        if (e.t === 'chest' || e.t === 'miniBoss' || e.t === 'arenaBoss' || isOnScreen(e, 170) || dist < 780) keep.push(e);
        else normal.push(e);
      }
      normal.sort((a,b) => Math.hypot(a.x-p.x,a.y-p.y) - Math.hypot(b.x-p.x,b.y-p.y));
      enemies = keep.concat(normal.slice(0, Math.max(0, limit - keep.length)));
    }
  }



  function separateEnemies(dt) {
    // v240-split: 몬스터 분리 계산은 후반 렉의 큰 원인이라 모바일에서는 2프레임에 1번만 실행.
    if (isCoarsePointerPerf() && (perfFrame % 2 === 1)) return;
    const list = [];
    const cap = perfCaps.separate;
    for (const e of enemies) {
      if (e && !e.dead && e.t !== 'chest') {
        list.push(e);
        if (list.length >= cap) break;
      }
    }
    const maxPairs = list.length;
    for (let i = 0; i < maxPairs; i++) {
      const a = list[i];
      if (!a) continue;
      for (let j = i + 1; j < maxPairs; j++) {
        const b = list[j];
        if (!b) continue;
        // 보스와 중간보스는 너무 밀리지 않게 일반 몬스터끼리보다 약하게 처리
        const bossPair = a.t === 'arenaBoss' || b.t === 'arenaBoss' || a.t === 'miniBoss' || b.t === 'miniBoss';
        const minD = (a.r || 14) + (b.r || 14) + (bossPair ? 2 : 5);
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if (d > 0 && d < minD) {
          const push = (minD - d) * (bossPair ? .18 : .46);
          dx /= d; dy /= d;
          const aHeavy = a.t === 'tank' || a.t === 'miniBoss' || a.t === 'arenaBoss';
          const bHeavy = b.t === 'tank' || b.t === 'miniBoss' || b.t === 'arenaBoss';
          const am = aHeavy ? .35 : .5;
          const bm = bHeavy ? .35 : .5;
          if (a.t !== 'arenaBoss') { a.x -= dx * push * bm; a.y -= dy * push * bm; }
          if (b.t !== 'arenaBoss') { b.x += dx * push * am; b.y += dy * push * am; }
          if (dir.bossRound) { clampToBossArena(a, (a.r || 14) + 18); clampToBossArena(b, (b.r || 14) + 18); }
          else {
            a.x = Math.max(a.r || 12, Math.min(world.w - (a.r || 12), a.x));
            a.y = Math.max(a.r || 12, Math.min(world.h - (a.r || 12), a.y));
            b.x = Math.max(b.r || 12, Math.min(world.w - (b.r || 12), b.x));
            b.y = Math.max(b.r || 12, Math.min(world.h - (b.r || 12), b.y));
          }
        } else if (d === 0) {
          b.x += (Math.random() - .5) * 6;
          b.y += (Math.random() - .5) * 6;
        }
      }
    }
  }


  function throwReturnBoomerang(w) {
    const target = nearestScreenTargetFrom(p.x, p.y, false, 900) || nearestTargetFrom(p.x, p.y, false, 900);
    const a = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.lastAim || 0);
    boomerangs.push({ x:p.x, y:p.y, a, t:0, outT:.55, backT:.55, r:(w.bsize || 7) * (w.evolved ? 1.35 : 1.05), dmg:(w.dmg || 28) * passivePower(w) * (w.evolved ? 1.10 : .80), color:weaponPool.boomer.color });
    addNovaEffect(p.x + Math.cos(a) * 40, p.y + Math.sin(a) * 40, 34, weaponPool.boomer.color, .16, 'boomer');
  }

  function updateReturnBoomerangs(dt) {
    for (let i=boomerangs.length-1;i>=0;i--) {
      const b = boomerangs[i];
      b.t += dt;
      const k = b.t <= b.outT ? b.t / b.outT : 1 - ((b.t - b.outT) / b.backT);
      const dist = Math.max(0, 520 * k);
      b.x = p.x + Math.cos(b.a) * dist;
      b.y = p.y + Math.sin(b.a) * dist;
      for (const e of enemies) {
        if (!e || e.dead || e.t === 'chest') continue;
        if (Math.hypot(e.x-b.x, e.y-b.y) < e.r + b.r) applyDamageToEnemy(e, b.dmg * dt * 7.0, false);
      }
      if (b.t >= b.outT + b.backT) boomerangs.splice(i,1);
    }
  }

  function drawReturnBoomerangs() {
    for (const b of boomerangs) {
      x.save();
      x.translate(b.x,b.y);
      x.rotate(time * 13);
      x.strokeStyle = b.color;
      x.lineWidth = 5;
      x.beginPath();
      x.arc(0,0,b.r,Math.PI*.18,Math.PI*1.55);
      x.stroke();
      x.restore();
    }
  }


  function update(dt) {
    if (state === 'settings') { syncUI(); return; }
    if (state === 'play' && !hardMode && !rangedTestMode && !chargerTestMode && !tankTestMode && currentWave > 30) { completeNormalMode(); return; }
    if (state !== 'play') return;
    time += dt; red = Math.max(0, red - dt); waveFlash = Math.max(0, waveFlash - dt);
    if (p.comboT > 0) p.comboT -= dt; else p.combo = 0;
    if (p.regen > 0) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
    if (p.dash > 0) p.dash -= dt;
    if (p.dashCd > 0) p.dashCd -= dt;
    if (p.novaCd > 0) p.novaCd -= dt;
    if (p.invuln > 0) p.invuln -= dt;
    for (const w of p.weapons) w.fc -= dt;
    for (let i = laserBeams.length - 1; i >= 0; i--) { laserBeams[i].life -= dt; if (laserBeams[i].life <= 0) laserBeams.splice(i, 1); }
    for (let i = novaEffects.length - 1; i >= 0; i--) { novaEffects[i].life -= dt; if (novaEffects[i].life <= 0) novaEffects.splice(i, 1); }
    for (let i = hitTexts.length - 1; i >= 0; i--) { hitTexts[i].life -= dt; hitTexts[i].y -= 34 * dt; if (hitTexts[i].life <= 0) hitTexts.splice(i, 1); }
    shake = Math.max(0, shake - dt);

    directorTick(dt);
    pruneForPerformance();
    if (state !== 'play') { syncUI(); return; }
    updateReturnBoomerangs(dt);

    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    const ml = Math.hypot(mx, my), sp = p.moveSpeed * (p.dash > 0 ? 3.4 : 1);
    if (ml > 0) { p.lastAim = Math.atan2(my, mx); p.x += mx / ml * sp * dt; p.y += my / ml * sp * dt; }
    updateDashTouchCooldown();
    p.x = Math.max(playerSideLeftLimitX(), Math.min(playerSideRightLimitX(), p.x)); p.y = Math.max(playerVisualTopLimitY(), Math.min(playerVisualBottomLimitY(), p.y)); // v240-split: 보이는 플레이어가 민트선까지만 이동
    if (dir.bossRound) clampToBossArena(p, p.r + 18);

    if (p.flameT > 0) {
      // v144 화염방사기: 이펙트 영역 안에 있는 몬스터에게만 도트딜.
      // 즉발 광역 피해와 화염 투사체 직접 피해를 제거해서 사기성을 낮춤.
      p.flameT -= dt;
      p.flameTick -= dt;
      const a = p.lastAim || 0;
      const stage = p.flameStage || 1;
      const evolved = !!p.flameEvolved;
      const reach = (evolved ? 255 : 210) + stage * 8;
      const width = (evolved ? 58 : 42) + stage * 3;
      const sx = p.x + Math.cos(a) * 28;
      const sy = p.y + Math.sin(a) * 28;
      if (novaEffects.length < 120) {
        novaEffects.push({ x:sx, y:sy, r:reach, maxR:reach, color:'#fb923c', life:.10, maxLife:.10, kind:'flamecone', a, spread:evolved ? .42 : .34 });
      }
      if (p.flameTick <= 0) {
        p.flameTick = .18;
        for (const e of enemies) {
          if (!e || e.dead || e.t === 'chest') continue;
          const vx = e.x - sx, vy = e.y - sy;
          const forward = Math.cos(a) * vx + Math.sin(a) * vy;
          const side = Math.abs(-Math.sin(a) * vx + Math.cos(a) * vy);
          if (forward > 0 && forward < reach && side < width + e.r * .45) {
            e.dotT = Math.max(e.dotT || 0, .65);
            e.dotD = Math.max(e.dotD || 0, (p.flameDmg || 4.0) * (evolved ? 1.18 : 1.0));
            e.dotTick = Math.min(e.dotTick || .18, .18);
            if (Math.random() < .13) effectText(e.x, e.y - 12, '화상');
          }
        }
      }
    }

    const mainWeapon = p.weapons[0];
    if (!rangedTestMode && !chargerTestMode && !tankTestMode && mainWeapon && mainWeapon.fc <= 0) { mainWeapon.fc = mainWeapon.fr; shootWeapon(mainWeapon); }
    if (!rangedTestMode && !chargerTestMode && !tankTestMode) updatePassiveWeapons(dt);
    syncMainWeaponStats();

    if (rangedTestMode || chargerTestMode || tankTestMode) {
      bullets.length = 0;
      laserBeams.length = 0;
      enemyBullets.length = 0;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      for (const e of enemies) {
        if (!e || e.dead || b.hit.has(e)) continue;
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
          applyDamageToEnemy(e, b.d); b.hit.add(e);
          if (b.src === 'cannon' || b.src === 'rocket') {
            const rr = b.src === 'cannon' ? 118 : 98;
            addNovaEffect(b.x, b.y, rr, b.c, .20, b.src === 'cannon' ? 'crack' : 'blast');
            for (const h of targetsInRadius(b.x, b.y, rr, 38)) if (h !== e) applyDamageToEnemy(h, b.d * (b.src === 'cannon' ? .42 : .36), true);
          }
          if (b.pierce > 0) b.pierce--; else { if (bullets[i] === b) bullets.splice(i, 1); }
          break;
        }
      }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (Math.hypot(b.x - p.x, b.y - p.y) < b.r + playerHitRadius()) {
        takePlayerDamage(b.d, b.x, b.y); enemyBullets.splice(i, 1);
        continue;
      }
      if (b.life <= 0) enemyBullets.splice(i, 1);
    }

    for (const e of enemies) {
      if (!e || e.dead) continue;
      if (e.dotT > 0) {
        e.dotT -= dt; e.dotTick = (e.dotTick || 0) - dt;
        if (e.dotTick <= 0) { e.dotTick = .35; applyDamageToEnemy(e, e.dotD || 3, false); }
        if (e.dead) continue;
      }
      if (e.slowT > 0) e.slowT -= dt; else e.slowMul = 1;
      const oldX = e.x, oldY = e.y;
      const dx = p.x - e.x, dy = p.y - e.y, l = Math.hypot(dx, dy) || 1;
      const speedMul = e.slowT > 0 ? (e.slowMul || .55) : 1;
      const isRangedTestEnemy = rangedTestMode && (e.t === 'shoot' || e.t === 'sniper' || e.t === 'bomber');
      const isChargerStillTestEnemy = chargerTestMode && e.t === 'charger';
      const isTankStillTestEnemy = tankTestMode && e.t === 'tank';

      if (!isRangedTestEnemy && !isChargerStillTestEnemy && !isTankStillTestEnemy && e.t !== 'chest') {
        e.x += dx / l * e.s * speedMul * dt;
        e.y += dy / l * e.s * speedMul * dt;
        if (dir.bossRound) clampToBossArena(e, e.r + 18);
      }

      if (!isRangedTestEnemy && !isChargerStillTestEnemy && !isTankStillTestEnemy && e.t === 'charger') {
        e.chargeT = (e.chargeT || 1.2) - dt;
        if (e.chargeT <= 0) { e.x += dx / l * 115 * dt; e.y += dy / l * 115 * dt; if (e.chargeT < -.55) e.chargeT = 1.3 + Math.random() * .7; }
      }

      if (isChargerStillTestEnemy || isTankStillTestEnemy) {
        e.faceA = Math.atan2(p.y - e.y, p.x - e.x);
      }
      if (e.t === 'tank' && !isTankStillTestEnemy) {
        e.faceA = Math.atan2(p.y - e.y, p.x - e.x);
      }
      if (e.t === 'shoot' || e.t === 'sniper' || e.t === 'bomber') {
        if (rangedTestMode) {
          // 테스트 모드: 이동 방향이 아니라 플레이어 위치를 기준으로 8방향을 고른다.
          e.faceA = Math.atan2(p.y - e.y, p.x - e.x);
        } else {
          const mvx = e.x - oldX;
          const mvy = e.y - oldY;
          if (Math.hypot(mvx, mvy) > 0.002) e.faceA = Math.atan2(mvy, mvx);
          else if (e.faceA == null) e.faceA = Math.PI / 2;
        }
      }
      if (e.t === 'healer' && e.scd != null) {
        e.scd -= dt;
        if (e.scd <= 0) {
          e.scd = 2.8;
          for (const ally of enemies) {
            if (ally !== e && ally.t !== 'chest' && Math.hypot(ally.x - e.x, ally.y - e.y) < 150) ally.hp = Math.min(ally.mhp, ally.hp + 18 + td() * 2.2);
          }
          effectText(e.x, e.y - 24, '+HEAL');
        }
      }
      if ((['shoot','sniper','bomber','miniBoss','boss','arenaBoss'].includes(e.t)) && e.scd != null) {
        e.scd -= dt;
        const range = e.t === 'arenaBoss' ? 360 : e.t === 'miniBoss' ? 275 : e.t === 'sniper' ? 470 : e.t === 'bomber' ? 250 : 235;
        if (l < range && e.scd <= 0) {
          const isEarly = currentWave <= 3;
          e.scd = e.t === 'arenaBoss' ? .9 : e.t === 'miniBoss' ? 1.18 : e.t === 'sniper' ? 2.25 : e.t === 'bomber' ? 2.0 : 1.75;
          const a = Math.atan2(dy, dx);
          const cnt = e.t === 'arenaBoss' ? 6 : e.t === 'miniBoss' ? 3 : e.t === 'bomber' ? 3 : 1;
          for (let k = 0; k < cnt; k++) {
            const off = cnt === 1 ? 0 : (k - (cnt - 1) / 2) * (e.t === 'bomber' ? .28 : .16);
            const spd = e.t === 'sniper' ? 330 : e.t === 'bomber' ? 180 : e.t === 'miniBoss' ? 205 : 235;
            const size = e.t === 'sniper' ? 4 : e.t === 'bomber' ? 9 : e.t === 'miniBoss' ? 6 : 5;
            const dmg = (e.t === 'sniper' ? 16 : e.t === 'bomber' ? 12 : e.t === 'miniBoss' ? 13 : 9) * (currentWave <= 2 ? .90 : currentWave <= 4 ? 1.12 : 1.32);
            enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(a+off)*spd, vy:Math.sin(a+off)*spd, r:size, d:dmg, life:e.t==='sniper'?2.7:3.2 });
          }
        }
      }
      if (e.t === 'arenaBoss' || e.t === 'miniBoss') bossPattern(e, dt);
      if (!isTankStillTestEnemy && e.t !== 'chest' && Math.hypot(e.x - p.x, e.y - p.y) < e.r + playerHitRadius()) {
        if (e.t === 'bomber') {
          takePlayerDamage((currentWave <= 3 ? 18 : 30), e.x, e.y);
          laserBeams.push({ x1:e.x-55, y1:e.y, x2:e.x+55, y2:e.y, width:12, life:.18, color:e.c });
          laserBeams.push({ x1:e.x, y1:e.y-55, x2:e.x, y2:e.y+55, width:12, life:.18, color:e.c });
          e.dead = true; die(e);
        } else {
          const baseHit = e.t === 'arenaBoss' ? 38 : e.t === 'miniBoss' ? 21 : e.t === 'tank' ? 18 : e.t === 'charger' ? 17 : 11;
          takePlayerDamage(baseHit * (currentWave <= 2 ? .95 : currentWave <= 4 ? 1.15 : 1.38), e.x, e.y);
        }
      }
    }

    separateEnemies(dt);

    for (let i = pickups.length - 1; i >= 0; i--) {
      const pp = pickups[i], dx = p.x - pp.x, dy = p.y - pp.y, d = Math.hypot(dx, dy) || 1;
      const pullByMagnet = pp.t === 'xp' && pp.magnetPull;
      if (!pp.permanent && pp.t !== 'xp') pp.life -= dt;
      if (pullByMagnet || d < p.pickupRadius) {
        const speed = pullByMagnet ? 1900 : 300;
        pp.x += dx / d * speed * dt; pp.y += dy / d * speed * dt;
      }
      if (d < 24) {
        if (pp.t === 'bossReward') showBossChestReward();
        else if (pp.t === 'miniReward') showMiniBossReward();
        else if (pp.t === 'heal') p.hp = Math.min(p.maxHp, p.hp + 16);
        else if (pp.t === 'magnet') { let c=0; for (const xp of pickups) if (xp.t === 'xp') { xp.magnetPull = true; xp.life = 999999; c++; } if (c < 12) { for (let k=0;k<8;k++) dropXpOrb(p.x+(Math.random()-.5)*180, p.y+(Math.random()-.5)*180, 35+currentWave*3, 2); } toastMsg('자석: 맵 전체 XP 폭풍 흡수!'); }
        else gain(pp.amount || 9);
        pickups.splice(i, 1); continue;
      }
      if (!pp.permanent && pp.t !== 'xp' && pp.life <= 0) pickups.splice(i, 1);
    }

    const arenaW2 = world.w * arenaShrinking, arenaH2 = world.h * arenaShrinking;
    const arenaX2 = (world.w - arenaW2) / 2, arenaY2 = (world.h - arenaH2) / 2;
    if (dir.bossRound) {
      cam.x = Math.max(0, Math.min(world.w - viewWorldW(), p.x - viewWorldW() / 2));
      cam.y = clampCameraYToGrid(playerCameraTargetY() - viewWorldH() / 2, world.h - viewWorldH()); // v240-split: 상단에서는 화면 정지, 플레이어만 이동
    } else {
      cam.x = Math.max(arenaX2, Math.min(Math.max(arenaX2, arenaX2 + arenaW2 - viewWorldW()), p.x - viewWorldW() / 2));
      cam.y = clampCameraYToGrid(playerCameraTargetY() - viewWorldH() / 2, arenaY2 + arenaH2 - viewWorldH()); // v240-split: 상단에서는 화면 정지, 플레이어만 이동
    }
    syncUI();
  }

    ui.hpFill.style.width = `${(p.hp / p.maxHp) * 100}%`;

    else ui.bossWrap.style.display = 'none';
  }



  // ===== STRONG 2.5D VISUAL PATCH v3: 배경은 유지하고, 플레이 화면만 상하 기준 약 10도 기울어진 것처럼 보이게 조정 =====
  const VIEW_TILT_DEG = 10;
  const VIEW_TILT_SCALE = 0.78; // 실제 10도는 체감이 약해서, 배경은 그대로 두고 플레이 레이어만 더 확실히 눌러 보이게 한다.
  const VIEW_TILT_Y_OFFSET = 0.12;

  function clamp01(v){ return Math.max(0, Math.min(1, v)); }

  function screenDepth(worldY) {
    return clamp01((worldY - cam.y) / Math.max(1, innerH));
  }

  function beginGameplayViewTilt() {
    const pivotX = cam.x + innerW * 0.5;
    const pivotY = cam.y + innerH * 0.5;
    x.save();
    x.translate(pivotX, pivotY + innerH * VIEW_TILT_Y_OFFSET);
    // 화면 위아래 방향만 눌러서, 배경이 아니라 맵 위의 플레이 대상들이 비스듬히 누운 것처럼 보이게 한다.
    x.scale(1, VIEW_TILT_SCALE);
    x.translate(-pivotX, -pivotY);
  }

  function shadeColor(hex, amt) {
    let h = String(hex || '#ffffff').replace('#','');
    if (h.length === 3) h = h.split('').map(c=>c+c).join('');
    const n = parseInt(h,16);
    let r = (n>>16)&255, g=(n>>8)&255, b=n&255;
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return `rgb(${r},${g},${b})`;
  }

  function drawEllipse(cx, cy, rx, ry, color, alpha=1) {
    x.save();
    x.globalAlpha *= alpha;
    x.fillStyle = color;
    x.beginPath();
    x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    x.fill();
    x.restore();
  }

  function drawCastShadow(cx, groundY, r, height=28, alpha=0.50) {
    // 왼쪽 위에서 빛이 온다고 가정해서 오른쪽 아래로 긴 그림자 투사
    const depth = screenDepth(groundY);
    const sx = r * (2.35 + depth * .95) + height * .58;
    const sy = r * (.42 + depth * .22);
    const offX = height * .96 + 24;
    const offY = height * .46 + 12;
    x.save();
    x.globalAlpha = alpha;
    const sh = x.createRadialGradient(cx + offX * .35, groundY + offY * .35, 2, cx + offX, groundY + offY, sx);
    sh.addColorStop(0, 'rgba(0,0,0,.76)');
    sh.addColorStop(.45, 'rgba(0,0,0,.36)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = sh;
    x.beginPath();
    x.ellipse(cx + offX, groundY + offY, sx, sy, .20, 0, Math.PI * 2);
    x.fill();
    x.restore();
  }

  function drawDropShadow(cx, cy, r, alpha=0.34) {
    drawCastShadow(cx, cy + r * .65, r, r * 1.1, alpha);
  }

  function drawDepthGround() {
    // v3: 배경은 사용자가 가장 괜찮다고 한 초기 버전의 깔끔한 네온 우주 격자로 복귀.
    // 대신 캐릭터/몬스터/상자 그림자는 그대로 남겨 2.5D 느낌은 유지한다.
    for (let gx = 0; gx < world.w; gx += 48) {
      x.strokeStyle = gx % 240 === 0 ? 'rgba(103,232,249,0.18)' : 'rgba(80,120,255,0.10)';
      x.lineWidth = gx % 240 === 0 ? 1.25 : 1;
      x.beginPath();
      x.moveTo(gx, 0);
      x.lineTo(gx, world.h);
      x.stroke();
    }
    for (let gy = 0; gy < world.h; gy += 48) {
      x.strokeStyle = gy % 240 === 0 ? 'rgba(168,85,247,0.16)' : 'rgba(80,120,255,0.10)';
      x.lineWidth = gy % 240 === 0 ? 1.25 : 1;
      x.beginPath();
      x.moveTo(0, gy);
      x.lineTo(world.w, gy);
      x.stroke();
    }

    // 너무 튀는 기둥/원근 바닥은 제거하고, 가장자리만 은은하게 남김.
    x.strokeStyle='rgba(34,211,238,.50)';
    x.lineWidth=4;
    x.strokeRect(0,0,world.w,world.h);
  }

  function draw3DChest(e) {
    const r = e.r;
    const topH = r * .55;
    const depth = r * .42;
    drawCastShadow(e.x, e.y + r*.62, r, r*1.35, .48);
    x.save();
    x.translate(e.x, e.y);
    // 앞면
    x.fillStyle = '#9a3412';
    x.fillRect(-r, -r*.38, r*2, r*1.25);
    // 오른쪽 옆면
    x.fillStyle = '#7c2d12';
    x.beginPath(); x.moveTo(r, -r*.38); x.lineTo(r+depth, -r*.38-depth*.58); x.lineTo(r+depth, r*.87-depth*.58); x.lineTo(r, r*.87); x.closePath(); x.fill();
    // 윗면
    x.fillStyle = '#fb923c';
    x.beginPath(); x.moveTo(-r, -r*.38); x.lineTo(-r+depth, -r*.38-depth*.58); x.lineTo(r+depth, -r*.38-depth*.58); x.lineTo(r, -r*.38); x.closePath(); x.fill();
    // 금속 띠
    x.fillStyle = '#fed7aa';
    x.fillRect(-r+4, r*.04, r*2-8, r*.22);
    x.fillStyle = '#fff7ed';
    x.fillRect(-4, -r*.34, 8, r*1.16);
    x.strokeStyle='rgba(255,255,255,.90)'; x.lineWidth=2.4;
    x.strokeRect(-r, -r*.38, r*2, r*1.25);
    x.beginPath(); x.moveTo(-r, -r*.38); x.lineTo(-r+depth, -r*.38-depth*.58); x.lineTo(r+depth, -r*.38-depth*.58); x.lineTo(r, -r*.38); x.stroke();
    x.restore();
  }

        for (let i=0;i<6;i++) { const a=i*Math.PI*2/6; x.beginPath(); x.moveTo(ef.x,ef.y); x.lineTo(ef.x+Math.cos(a)*(ef.r*.72+grow), ef.y+Math.sin(a)*(ef.r*.72+grow)); x.stroke(); }

        x.fillStyle = ef.color; for (let i=0;i<4;i++){ const a=i*Math.PI*2/4 + time*1.5; x.beginPath(); x.arc(ef.x+Math.cos(a)*(ef.r*.18), ef.y+Math.sin(a)*(ef.r*.18), ef.r*.35 + grow*.25, 0, Math.PI*2); x.fill(); }
      } else if (ef.kind === 'flamecone') {
        const ang = ef.a || 0, spread = ef.spread || .62;
        const r = ef.r + grow;
        const grad = x.createRadialGradient(ef.x, ef.y, 8, ef.x + Math.cos(ang)*r*.58, ef.y + Math.sin(ang)*r*.58, r);
        grad.addColorStop(0, '#fff7ad'); grad.addColorStop(.28, '#fb923c'); grad.addColorStop(1, ef.color);
        x.fillStyle = grad;
        x.beginPath(); x.moveTo(ef.x, ef.y);
        for (let i=0;i<=16;i++) { const a = ang - spread + spread*2*i/16; const rr = r * (.78 + .18*Math.sin(i*1.7 + time*6)); x.lineTo(ef.x + Math.cos(a)*rr, ef.y + Math.sin(a)*rr); }
        x.closePath(); x.fill();
        x.globalAlpha = Math.min(.95, alpha); x.strokeStyle = '#ffedd5'; x.lineWidth = 2; x.stroke();
      } else if (ef.kind === 'flame') {
        x.strokeStyle = ef.color; x.lineWidth = 9; x.beginPath(); x.arc(ef.x, ef.y, ef.r + grow, 0, Math.PI * 2); x.stroke();
        for (let i=0;i<10;i++){ const a=i*Math.PI*2/10 + time*4; x.beginPath(); x.moveTo(ef.x+Math.cos(a)*(ef.r*.4), ef.y+Math.sin(a)*(ef.r*.4)); x.lineTo(ef.x+Math.cos(a)*(ef.r+grow),ef.y+Math.sin(a)*(ef.r+grow)); x.stroke(); }
      } else if (ef.kind === 'pulsegrid') {
        x.strokeStyle = ef.color; x.lineWidth = 4; x.beginPath(); x.arc(ef.x, ef.y, ef.r + grow, 0, Math.PI * 2); x.stroke();
        x.strokeRect(ef.x-(ef.r*.55+grow*.35), ef.y-(ef.r*.55+grow*.35), (ef.r*1.1+grow*.7), (ef.r*1.1+grow*.7));
      } else if (ef.kind === 'boomer') {
        x.strokeStyle = ef.color; x.lineWidth = 4; for (let i=0;i<3;i++){ x.beginPath(); x.arc(ef.x, ef.y, ef.r*.45 + i*ef.r*.18 + grow*.3, Math.PI*.15, Math.PI*1.45); x.stroke(); }
      } else if (ef.kind === 'mine') {
        x.fillStyle = ef.color; x.beginPath(); x.arc(ef.x, ef.y, ef.r*.30 + grow*.3, 0, Math.PI*2); x.fill();
        x.strokeStyle = '#fff'; x.lineWidth = 3; for (let i=0;i<8;i++){ const a=i*Math.PI*2/8; x.beginPath(); x.moveTo(ef.x,ef.y); x.lineTo(ef.x+Math.cos(a)*(ef.r+grow), ef.y+Math.sin(a)*(ef.r+grow)); x.stroke(); }
      } else if (ef.kind === 'drone') {
        x.strokeStyle = ef.color; x.lineWidth = 2.5; x.strokeRect(ef.x-ef.r*.6, ef.y-ef.r*.6, ef.r*1.2, ef.r*1.2);
      } else if (ef.kind === 'muzzle') {
        x.strokeStyle = ef.color; x.lineWidth = 5; x.beginPath(); x.arc(ef.x, ef.y, ef.r + grow, -0.6, 0.6); x.stroke();
      } else {
        x.strokeStyle = ef.color; x.lineWidth = ef.kind === 'poison' || ef.kind === 'flame' ? 10 : 6; x.beginPath(); x.arc(ef.x, ef.y, ef.r + grow, 0, Math.PI * 2); x.stroke();
      }
      x.globalAlpha = 1;
    }
    for (const b of bullets) {
      x.fillStyle = b.c; x.strokeStyle = '#ffffff'; x.lineWidth = 1.6;
      if (b.src === 'drone') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.fillRect(-b.r*1.3, -b.r*.55, b.r*2.6, b.r*1.1); x.strokeRect(-b.r*1.3, -b.r*.55, b.r*2.6, b.r*1.1); x.restore();
      } else if (b.src === 'boomer') {
        x.beginPath(); x.arc(b.x, b.y, b.r, Math.PI*0.18, Math.PI*1.55); x.stroke();
      } else if (b.src === 'shardfall' || b.src === 'support-shard') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.beginPath(); x.moveTo(0, -b.r*1.6); x.lineTo(b.r, 0); x.lineTo(0, b.r*1.6); x.lineTo(-b.r, 0); x.closePath(); x.fill(); x.restore();
      } else if (b.src === 'flamepuff') {
        const grad = x.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r*2.1);
        grad.addColorStop(0, '#fff7ad'); grad.addColorStop(.42, '#fb923c'); grad.addColorStop(1, b.c);
        x.fillStyle = grad; x.globalAlpha = .82;
        x.beginPath(); x.arc(b.x, b.y, b.r*1.8, 0, Math.PI*2); x.fill(); x.globalAlpha = 1;
      } else if (b.src === 'ember') {
        x.beginPath(); x.arc(b.x, b.y, b.r, 0, Math.PI*2); x.fill(); x.beginPath(); x.arc(b.x + 1.5, b.y - 1.5, b.r*.45, 0, Math.PI*2); x.fillStyle = '#fde68a'; x.fill();
      } else if (b.src === 'spore') {
        x.globalAlpha = .75; for (let i=0;i<3;i++){ x.beginPath(); x.arc(b.x + Math.cos(i*2.1)*2.5, b.y + Math.sin(i*2.1)*2.5, b.r*.62, 0, Math.PI*2); x.fill(); } x.globalAlpha = 1;
      } else if (b.src === 'shrapnel') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.fillRect(-b.r*.2, -b.r*1.3, b.r*.4, b.r*2.6); x.restore();
      } else if (b.src === 'subshotgun') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.beginPath(); x.moveTo(-b.r*1.1, -b.r*.8); x.lineTo(b.r*1.3, 0); x.lineTo(-b.r*1.1, b.r*.8); x.closePath(); x.fill(); x.restore();
      } else if (b.src === 'support-pulse') {
        x.beginPath(); x.arc(b.x, b.y, b.r*1.15, 0, Math.PI*2); x.stroke(); x.beginPath(); x.arc(b.x, b.y, b.r*.55, 0, Math.PI*2); x.fill();
      } else if (b.src === 'support-rifle') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.fillRect(-b.r*1.4, -b.r*.35, b.r*2.8, b.r*.7); x.restore();
      } else {
        x.beginPath(); x.arc(b.x, b.y, b.r, 0, Math.PI * 2); x.fill();
      }
    }
    drawReturnBoomerangs();
    for (const b of enemyBullets) { x.beginPath(); x.arc(b.x, b.y, b.r, 0, Math.PI * 2); x.fillStyle = '#fb7185'; x.fill(); }
    for (const e of enemies) {
      drawEnemyBody(e);
      x.fillStyle = '#fff'; x.fillRect(e.x - e.r, e.y - e.r*1.55 - 10, e.r * 2, 4); x.fillStyle = '#ef4444'; x.fillRect(e.x - e.r, e.y - e.r*1.55 - 10, e.r * 2 * (e.hp / e.mhp), 4);
    }
    for (const pp of pickups) {
      drawDropShadow(pp.x, pp.y, pp.t === 'bossReward' ? 18 : pp.t === 'miniReward' ? 15 : pp.t === 'magnet' ? 18 : pp.t === 'heal' ? 8 : 6, .24);
      if (pp.t === 'magnet') {
        x.save(); x.translate(pp.x, pp.y);
        const pulse = Math.sin(time*5)*2;
        x.globalAlpha = .25; x.fillStyle = '#38bdf8'; x.beginPath(); x.arc(0, 0, 27 + pulse, 0, Math.PI*2); x.fill(); x.globalAlpha = 1;
        x.lineCap = 'round'; x.lineJoin = 'round';
        x.lineWidth = 9; x.strokeStyle = '#38bdf8';
        x.beginPath(); x.arc(0, -2, 17, Math.PI * .12, Math.PI * .88, false); x.stroke();
        x.lineWidth = 5; x.strokeStyle = '#e0f2fe'; x.beginPath(); x.arc(0, -2, 17, Math.PI * .22, Math.PI * .78, false); x.stroke();
        x.fillStyle = '#ef4444'; x.fillRect(-22, 3, 11, 16); x.fillStyle = '#f8fafc'; x.fillRect(11, 3, 11, 16);
        x.strokeStyle = '#ffffff'; x.lineWidth = 2; x.strokeRect(-22, 3, 11, 16); x.strokeRect(11, 3, 11, 16);
        x.fillStyle = '#e0f2fe'; x.font = 'bold 10px system-ui'; x.textAlign = 'center'; x.fillText('MAG', 0, -23); x.fillText('XP', 0, 33);
        x.restore();
      } else if (pp.t === 'miniReward') {
        x.save(); x.translate(pp.x, pp.y); x.fillStyle = '#f59e0b'; x.strokeStyle = '#fff7ed'; x.lineWidth = 3; x.fillRect(-15,-15,30,30); x.strokeRect(-15,-15,30,30); x.fillStyle='#fff7ed'; x.font='bold 11px system-ui'; x.textAlign='center'; x.fillText('MID',0,4); x.restore();
      } else if (pp.t === 'bossReward') {
        x.save(); x.translate(pp.x, pp.y); x.fillStyle = '#dc2626'; x.strokeStyle = '#fff7ed'; x.lineWidth = 4; x.fillRect(-18,-18,36,36); x.strokeRect(-18,-18,36,36); x.fillStyle='#fff7ed'; x.font='bold 11px system-ui'; x.textAlign='center'; x.fillText('BOSS',0,4); x.restore();
      } else if (pp.t === 'heal') {
        x.beginPath(); x.arc(pp.x, pp.y, 8, 0, Math.PI * 2); x.fillStyle = '#22c55e'; x.fill(); x.fillStyle = '#ffffff'; x.fillRect(pp.x-2, pp.y-6, 4, 12); x.fillRect(pp.x-6, pp.y-2, 12, 4);
      } else {
        const tier = pp.tier || 1, rr = tier === 3 ? 10 : tier === 2 ? 8 : 6;
        x.beginPath(); x.arc(pp.x, pp.y, rr, 0, Math.PI * 2); x.fillStyle = tier === 3 ? '#f472b6' : tier === 2 ? '#60a5fa' : '#facc15'; x.fill();
        x.strokeStyle = '#ffffff'; x.lineWidth = 1.5; x.stroke();
      }
    }
    const orbitSub = p.weapons.slice(1).find(w => w && w.key === 'orbit');
    if (orbitSub) {
      const blades = Math.min(8, 3 + orbitSub.stage + (orbitSub.evolved ? 2 : 0));
      const rr = 110 + orbitSub.stage * 12 + (orbitSub.evolved ? 40 : 0);
      x.strokeStyle = weaponPool.orbit.color; x.lineWidth = 3; x.globalAlpha = .82;
      for (let i=0;i<blades;i++) {
        const a = time * 3.4 + i * Math.PI * 2 / blades;
        x.beginPath();
        x.moveTo(p.x + Math.cos(a) * (rr - 18), p.y + Math.sin(a) * (rr - 18));
        x.lineTo(p.x + Math.cos(a) * (rr + 18), p.y + Math.sin(a) * (rr + 18));
        x.stroke();
      }
      x.globalAlpha = 1;
    }
    const droneSub = p.weapons.slice(1).find(w => w && w.key === 'drone');
    if (droneSub) {
      const drones = Math.min(6, 2 + droneSub.stage + (droneSub.evolved ? 2 : 0));
      for (let i=0;i<drones;i++) {
        const a = time * 2.4 + i * Math.PI * 2 / drones;
        x.beginPath(); x.arc(p.x + Math.cos(a)*60, p.y + Math.sin(a)*60, 6, 0, Math.PI*2); x.fillStyle = weaponPool.drone.color; x.fill();
      }
    }
    drawPlayerBody();
    for (const ht of hitTexts) { x.globalAlpha = Math.max(0, ht.life/.55); x.fillStyle = '#fecaca'; x.font = 'bold 20px system-ui'; x.textAlign='center'; x.fillText(ht.text, ht.x, ht.y); x.globalAlpha = 1; }
    x.restore(); // gameplay tilt layer
    x.restore();

    if (red > 0) { x.fillStyle = `rgba(255,40,40,${Math.min(.38, red * 0.9)})`; x.fillRect(-30, -30, innerW+60, innerH+60); x.strokeStyle = `rgba(255,80,80,${Math.min(.9, red*2)})`; x.lineWidth = 18; x.strokeRect(8, 8, innerW-16, innerH-16); }
    if (waveFlash > 0) { const a = Math.min(1, waveFlash / 1.6); x.globalAlpha = a; x.textAlign='center'; x.font='900 42px system-ui'; x.fillStyle='#e0f2fe'; x.shadowColor='#67e8f9'; x.shadowBlur=20; x.fillText(`${hardMode?'HARD ':''}WAVE ${currentWave}`, innerW/2, Math.max(96, innerH * 0.28)); /* v240-split: 화면 위와 가운데 사이 */ x.shadowBlur=0; x.globalAlpha=1; }
    x.restore();

    const w = minimapCanvas.width, h = minimapCanvas.height;
    mc.clearRect(0, 0, w, h); mc.fillStyle = '#07101f'; mc.fillRect(0, 0, w, h);
    const sx = w / world.w, sy = h / world.h; mc.strokeStyle = 'rgba(255,255,255,0.12)'; mc.strokeRect(1, 1, w - 2, h - 2);
    for (const e of enemies.slice(0, 90)) { mc.fillStyle = e.t === 'arenaBoss' ? '#ff5d73' : e.t === 'miniBoss' ? '#f59e0b' : e.t === 'chest' ? '#f97316' : '#a78bfa'; const s = e.t === 'arenaBoss' ? 5 : e.t === 'miniBoss' ? 4 : e.t === 'chest' ? 4 : 3; mc.fillRect(e.x * sx - s / 2, e.y * sy - s / 2, s, s); }
    mc.fillStyle = '#7dd3fc'; mc.beginPath(); mc.arc(p.x * sx, p.y * sy, 3.5, 0, Math.PI * 2); mc.fill();
    mc.strokeStyle = 'rgba(125,211,252,0.6)'; mc.strokeRect(cam.x * sx, cam.y * sy, innerW * sx, innerH * sy);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    try { update(dt); draw(); }
    catch (err) {
      console.error('game loop recovered', err);
      bullets = bullets.slice(-120); enemyBullets = enemyBullets.slice(-80); laserBeams = laserBeams.slice(-30); pickups = pickups.slice(-60);
      {
        const protectedEnemies = enemies.filter(e => e && !e.dead && (e.t === 'arenaBoss' || e.t === 'miniBoss' || e.t === 'chest'));
        const normalEnemies = enemies.filter(e => e && !e.dead && !(e.t === 'arenaBoss' || e.t === 'miniBoss' || e.t === 'chest') && (isOnScreen(e, 220) || Math.hypot(e.x-p.x,e.y-p.y) < 900)).slice(-Math.max(40, perfCaps.enemy - protectedEnemies.length));
        enemies = protectedEnemies.concat(normalEnemies);
      }
      if (!safetyNotice) { safetyNotice = true; toastMsg(''); setTimeout(() => safetyNotice = false, 2000); }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  var started=false;
  var home=document.getElementById('home');
  var frame=document.getElementById('gameFrame');
  var tpl=document.getElementById('gameTemplate');
  var btn=document.getElementById('play');

  function isFs(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function sendFs(){
    try{
      if(frame && frame.contentWindow){
        frame.contentWindow.postMessage({type:'SW_FS_STATE', on:isFs()}, '*');
      }
    }catch(e){}
  }
  async function setFs(on){
    try{
      if(on && !isFs()){
        const el=document.documentElement;
        if(el.requestFullscreen) await el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }else if(!on && isFs()){
        if(document.exitFullscreen) await document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }catch(e){}
    setTimeout(sendFs, 100);
  }
  function quitToHome(){
    started=false;
    try{
      if(isFs()){
        if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }catch(e){}
    frame.style.display='none';
    frame.srcdoc='';
    home.style.display='flex';
    setTimeout(function(){ frame.removeAttribute('srcdoc'); }, 30);
  }
  function startGame(e){
    if(e) e.preventDefault();
    if(started) return;
    started=true;
    home.style.display='none';
    frame.style.display='block';
    frame.srcdoc=tpl.innerHTML;
    setTimeout(function(){ setFs(true); }, 80);
    setTimeout(sendFs, 350);
  }

  window.addEventListener('message', function(ev){
    var msg=ev.data || {};
    if(msg.type==='SW_QUIT') quitToHome();
    if(msg.type==='SW_FS_SET') setFs(!!msg.on);
    if(msg.type==='SW_FS_QUERY') sendFs();
  });
  document.addEventListener('fullscreenchange', sendFs);
  document.addEventListener('webkitfullscreenchange', sendFs);

  btn.addEventListener('click', startGame, false);
  btn.addEventListener('touchend', startGame, false);
  btn.addEventListener('pointerup', startGame, false);
})();
</script>
