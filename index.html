<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Space War / Neon Rift</title>
  <script>
    (function () {
      function deviceType() {
        var ua = navigator.userAgent || "";
        var w = window.innerWidth || 0;
        var h = window.innerHeight || 0;
        var shortSide = Math.min(w, h);
        var longSide = Math.max(w, h);

        var isIPhone = /iPhone|iPod/i.test(ua);
        var isAndroidPhoneUA = /Android/i.test(ua) && /Mobile/i.test(ua);

        var isIpad = /iPad/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
        var isGalaxyTab = /SM-X|Galaxy Tab|Tab S/i.test(ua);
        var isTabletWord = /Tablet/i.test(ua);

        var phoneSize = shortSide <= 600 && longSide <= 980;
        var tabletSize = shortSide >= 600 && longSide >= 900;

        if (isIPhone || (isAndroidPhoneUA && phoneSize)) return "mobile";
        if (isIpad || isAndroidTablet || isGalaxyTab || isTabletWord || tabletSize) return "tablet";
        return "pc";
      }

      var type = deviceType();
      if (type === "mobile") location.replace("mobile.html");
      else if (type === "tablet") location.replace("tablet.html");
      else location.replace("pc_tablet_base.html");
    })();
  </script>
</head>
<body>
  <p>Loading Space War...</p>
</body>
</html>
